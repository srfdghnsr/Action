name: probe-sources

on:
  push:
    paths:
      - "scripts/probe_sources.py"
      - ".github/workflows/probe-sources.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  issues: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Probe data sources
        id: p
        continue-on-error: true
        run: python scripts/probe_sources.py 2>&1 | tee /tmp/probe.log

      - name: Report probe result as issue
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = '';
            try { body = fs.readFileSync('/tmp/probe.log', 'utf8').slice(-7500); }
            catch (e) { body = '(日志不可读: ' + e.message + ')'; }
            const stamp = new Date().toISOString().replace('T', ' ').slice(0, 19);
            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: '[探测] A股数据源可用性 ' + stamp + 'Z',
              body: '美国 runner 上各数据源实测结果：\n\n```\n' + body + '\n```'
            });
